name: Deploy site to GitHub Pages

on:
  push:
    branches: [claude/gupta-enterprises-redesign-m1b9y6]
  workflow_dispatch:

# Only needs to write the gh-pages branch — avoids the Pages API entirely.
permissions:
  contents: write

concurrency:
  group: deploy-gh-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build with Astro
        env:
          PAGES_SITE: https://guptadarsheel123-lgtm.github.io
          PAGES_BASE: /gepm
        run: npm run build

      - name: Add .nojekyll
        run: touch dist/.nojekyll

      - name: Publish to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: gh-pages
          force_orphan: true
